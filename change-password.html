<!DOCTYPE html>
<html lang="en" style="visibility:hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password - KBF-UK</title>
    <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-body" data-theme="emerald">
    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <span class="auth-logo-ring">
                    <span class="auth-logo-glow"></span>
                    <span class="auth-logo-img"><img src="/assets/images/logo/KBF-Logo.jpeg" alt="KBF-UK Logo"></span>
                </span>
            </div>

            <h1 class="auth-title">Change password</h1>
            <p class="auth-intro">You are signed in with a temporary password.</p>

            <div class="auth-msg auth-msg-warning">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                <span>For security, choose your own password before you use the admin pages.</span>
            </div>

            <div id="message" class="auth-msg hidden" role="alert"></div>

            <form id="changePasswordForm" class="auth-form" novalidate>
                <div class="auth-field">
                    <label for="currentPassword" class="auth-label">Temporary password</label>
                    <div class="pw-wrap">
                        <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password" class="auth-input">
                        <button type="button" class="pw-toggle" aria-controls="currentPassword"></button>
                    </div>
                </div>
                <div class="auth-field">
                    <label for="newPassword" class="auth-label">New password</label>
                    <div class="pw-wrap">
                        <input id="newPassword" name="newPassword" type="password" required minlength="8" autocomplete="new-password" class="auth-input" aria-describedby="newPasswordHint">
                        <button type="button" class="pw-toggle" aria-controls="newPassword"></button>
                    </div>
                    <p id="newPasswordHint" class="auth-hint">At least 8 characters, with letters and numbers.</p>
                </div>
                <div class="auth-field">
                    <label for="confirmPassword" class="auth-label">Confirm new password</label>
                    <div class="pw-wrap">
                        <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" class="auth-input">
                        <button type="button" class="pw-toggle" aria-controls="confirmPassword"></button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="auth-btn">Change password</button>
            </form>
        </div>
    </main>

    <script src="/js/escape.js"></script>
    <script src="/js/password-toggle.js"></script>
    <script>
    // ============================================
    // CRITICAL SECURITY: Authentication Check FIRST
    // The page stays hidden until the session is confirmed to be waiting
    // for a password change.
    // ============================================
    (function () {
        var theme = KBF.storage.get('badminton-theme', 'emerald');
        if (['emerald', 'cyan', 'yellow', 'orange'].indexOf(theme) === -1) theme = 'emerald';
        document.body.setAttribute('data-theme', theme);
    })();

    (async function () {
        document.documentElement.style.visibility = 'hidden';

        try {
            const response = await fetch('/api/auth/session.php', {
                method: 'GET',
                credentials: 'include'
            });
            const data = await response.json();

            // Not signed in at all
            if (!data.loggedIn && !data.mustChangePassword) {
                window.location.href = '/login';
                return;
            }
            // Already signed in normally (should not be on this page)
            if (data.loggedIn && !data.mustChangePassword) {
                window.location.href = '/admin/dashboard';
                return;
            }
            // Must be in the password change state
            if (!data.mustChangePassword) {
                window.location.href = '/login';
                return;
            }

            if (data.csrf_token) {
                KBF.storage.session.set('csrf_token', data.csrf_token);
            }

            document.documentElement.style.visibility = 'visible';
            document.getElementById('currentPassword').focus();
        } catch (error) {
            console.error('Auth error:', error);
            window.location.href = '/login';
        }
    })();

    // ============================================
    // FORM
    // ============================================
    (function () {
        'use strict';

        var ICONS = {
            error: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
            success: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>'
        };
        var messageBox = document.getElementById('message');
        var submitBtn = document.getElementById('submitBtn');
        var busy = false;

        function getCSRFToken() {
            return KBF.storage.session.get('csrf_token', '');
        }

        function showMessage(kind, text) {
            messageBox.className = 'auth-msg auth-msg-' + kind;
            messageBox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[kind] + '</svg>';
            var span = document.createElement('span');
            span.textContent = text;
            messageBox.appendChild(span);
        }

        function setBusy(on, label) {
            busy = on;
            submitBtn.disabled = on;
            submitBtn.textContent = label || (on ? 'Saving...' : 'Change password');
        }

        // Mark a field as wrong: linked to the message box (role="alert"),
        // focused, cleared again when the field is changed
        function markInvalid(id) {
            var field = document.getElementById(id);
            var ids = (field.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean);
            if (ids.indexOf('message') === -1) ids.push('message');
            field.setAttribute('aria-describedby', ids.join(' '));
            field.setAttribute('aria-invalid', 'true');
            field.addEventListener('input', function () {
                field.removeAttribute('aria-invalid');
                var rest = ids.filter(function (x) { return x !== 'message'; });
                if (rest.length) field.setAttribute('aria-describedby', rest.join(' '));
                else field.removeAttribute('aria-describedby');
            }, { once: true });
            field.focus();
        }

        document.getElementById('changePasswordForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (busy) return;

            var currentPassword = document.getElementById('currentPassword').value;
            var newPassword = document.getElementById('newPassword').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            if (!currentPassword) {
                showMessage('error', 'Enter your temporary password.');
                markInvalid('currentPassword');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('error', 'The two new passwords do not match.');
                markInvalid('confirmPassword');
                return;
            }
            if (newPassword.length < 8) {
                showMessage('error', 'The new password must be at least 8 characters.');
                markInvalid('newPassword');
                return;
            }
            if (!/[a-zA-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                showMessage('error', 'The new password needs both letters and numbers.');
                markInvalid('newPassword');
                return;
            }

            messageBox.className = 'auth-msg hidden';
            setBusy(true);

            fetch('/api/auth/change-password.php', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-Token': getCSRFToken()
                },
                body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
            }).then(function (response) {
                return response.json().catch(function () { return {}; });
            }).then(function (data) {
                if (data && data.success) {
                    KBFPasswordToggle.hideAll();
                    showMessage('success', 'Password changed. Continuing...');
                    setBusy(true, 'Please wait...');
                    if (data.csrf_token) {
                        KBF.storage.session.set('csrf_token', data.csrf_token);
                    }
                    // 2-step verification comes next when it is on or required;
                    // otherwise every staff member goes to the admin dashboard
                    var nextUrl = data.twoStepRequired
                        ? (data.mode === 'setup' ? '/admin/two-step' : '/two-step')
                        : '/admin/dashboard';
                    setTimeout(function () { window.location.href = nextUrl; }, 1500);
                    return;
                }
                showMessage('error', data && data.message ? String(data.message) : 'The password could not be changed. Please try again.');
                setBusy(false);
            }).catch(function () {
                showMessage('error', 'Something went wrong. Please check your connection and try again.');
                setBusy(false);
            });
        });
    })();
    </script>
</body>
</html>
