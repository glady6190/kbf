<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posts - Organiser</title>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .theme-switcher-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .theme-switcher-btn:hover { transform: scale(1.1); border-color: white; }
        .theme-switcher-btn.active { border-color: white; box-shadow: 0 0 10px currentColor; }
        .theme-switcher-btn.active::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 12px; }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
        .post-card { background: linear-gradient(135deg, #1f2937 0%, #111827 100%); transition: all 0.3s ease; }
        .post-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
        
        @media (max-width: 768px) {
            .theme-switcher-btn { width: 24px; height: 24px; }
            .theme-switcher-btn.active::after { font-size: 10px; }
            .brutal-shadow { box-shadow: 3px 3px 0px var(--theme-primary); }
            .brutal-shadow:hover { box-shadow: 4px 4px 0px var(--theme-primary); }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <div>
        <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black uppercase mb-2">
            <span class="theme-primary-text">My</span> Posts
        </h1>
        <div class="h-2 w-32 theme-primary-bg mb-3"></div>
        <p class="text-gray-400 font-bold uppercase text-sm">Manage tournament announcements</p>
    </div>
    <div id="createPostButton" class="hidden w-full sm:w-auto">
        <select id="completedTournaments" 
                class="w-full sm:w-auto px-4 py-3 bg-slate-800 border-4 border-gray-700 text-white font-bold uppercase text-sm focus:outline-none focus:border-emerald-500 transition mb-2 sm:mb-0 sm:mr-2">
            <option value="">Select Tournament...</option>
        </select>
        <button onclick="goToCreatePost()" 
                class="w-full sm:w-auto theme-primary-bg text-slate-900 px-6 py-3 font-black uppercase text-sm brutal-shadow transition-all hover:opacity-90">
            + Create Post
        </button>
    </div>
</div>

        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-gray-700 border-t-emerald-500 mb-4"></div>
            <p class="text-gray-400 font-bold uppercase text-sm">Loading posts...</p>
        </div>

        <div id="postsList" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <div id="noPosts" class="hidden bg-slate-900 border-4 border-gray-700 p-16 text-center">
            <div class="inline-flex items-center justify-center w-32 h-32 theme-primary-bg border-4 border-gray-700 mb-6">
                <svg class="w-16 h-16 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
                </svg>
            </div>
            <h3 class="text-3xl font-black text-white mb-3 uppercase">No Posts Yet</h3>
            <p class="text-gray-400 font-bold mb-6 uppercase text-lg">Complete a tournament and create your first post</p>
            <a href="/clubadmin/tournaments" 
               class="inline-block theme-primary-bg text-slate-900 px-8 py-4 font-black uppercase text-sm brutal-shadow transition-all">
                View Tournaments →
            </a>
        </div>
    </div>

    <script src="/js/escape.js"></script>
    <script src="/js/admin-shell.js"></script>
    <script>
    // ============================================
    // Page guard and shared header
    // ============================================
    KBFShell.start({ anyOf: ['content.own_news_gallery'], active: 'my-posts' }).then(function (user) {
        window.kbfUser = user;
        loadPosts();
    });

    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    // Every post this user created (GET /api/announcements.php?mine=1).
    // Deleted posts are hidden (IsVisible = 0) and are left out, as before.
    async function loadPosts() {
        try {
            const tournamentResponse = await authenticatedFetch('/api/tournaments.php?mine=1');
            const tournamentData = await tournamentResponse.json();
            const tournaments = (tournamentData.success && Array.isArray(tournamentData.tournaments)) ? tournamentData.tournaments : [];

            fillTournamentPicker(tournaments);

            const response = await authenticatedFetch('/api/announcements.php?mine=1');
            const data = await response.json();

            const posts = ((data.success && Array.isArray(data.announcements)) ? data.announcements : [])
                .filter(p => String(p.IsVisible) !== '0')
                .sort((a, b) => new Date(b.CreatedDate) - new Date(a.CreatedDate));

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('postsList').classList.add('hidden');
            document.getElementById('noPosts').classList.add('hidden');

            if (!data.success) {
                const loading = document.getElementById('loading');
                loading.textContent = '';
                const p = document.createElement('p');
                p.className = 'text-red-400 font-bold uppercase text-lg';
                p.textContent = data.message || 'Error Loading Posts';
                loading.appendChild(p);
                loading.classList.remove('hidden');
                return;
            }

            if (posts.length === 0) {
                document.getElementById('noPosts').classList.remove('hidden');
            } else {
                document.getElementById('postsList').classList.remove('hidden');
                displayPosts(posts);
            }
        } catch (error) {
            console.error('Error loading posts:', error);
            document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold uppercase text-lg">Error Loading Posts</p>';
        }
    }

    function fillTournamentPicker(tournaments) {
        const select = document.getElementById('completedTournaments');
        while (select.options.length > 1) select.remove(1);

        // Filter tournaments that are Approved or Completed
        const eligibleTournaments = tournaments.filter(t =>
            t.Status === 'Approved' || t.Status === 'Completed'
        );

        if (eligibleTournaments.length > 0) {
                eligibleTournaments.forEach(tournament => {
                    const option = document.createElement('option');
                    option.value = tournament.TournamentId;
                    option.textContent = `${tournament.Name} (${tournament.Status})`;
                    select.appendChild(option);
                });
                
                document.getElementById('createPostButton').classList.remove('hidden');
        } else {
            document.getElementById('createPostButton').classList.add('hidden');
        }
    }

function goToCreatePost() {
    const select = document.getElementById('completedTournaments');
    const tournamentId = select.value;
    
    if (!tournamentId) {
        alert('Please select a tournament first');
        return;
    }
    
    window.location.href = `/clubadmin/create-post?id=${tournamentId}`;
}

    function displayPosts(posts) {
        const container = document.getElementById('postsList');

        container.innerHTML = posts.map(post => `
            <div class="post-card border-4 border-gray-700 p-6">
                ${post.FeaturedImage ? `
                    <div class="mb-4 -mx-6 -mt-6">
                        <img${imgVariantAttrs(post.FeaturedImage, 'thumb')} alt="${escapeHtml(post.Title)}" width="400" height="192" loading="lazy" decoding="async" class="w-full h-48 object-contain bg-slate-800 border-b-4 border-gray-700">
                    </div>
                ` : ''}
                
                <div class="mb-4">
                    <h3 class="text-2xl font-black text-white uppercase mb-2 line-clamp-2">
                        ${escapeHtml(post.Title)}
                    </h3>
                    <p class="text-gray-400 text-sm font-bold uppercase mb-2">
                        Tournament: ${escapeHtml(post.TournamentName)}
                    </p>
                    <p class="text-gray-500 text-xs font-bold uppercase">
                        Published: ${new Date(post.CreatedDate).toLocaleDateString('en-GB', { 
                            year: 'numeric', month: 'short', day: 'numeric' 
                        })}
                    </p>
                </div>

                <div class="mb-4 pb-4 border-b-2 border-gray-700">
                    <p class="text-gray-300 text-sm line-clamp-3">
                        ${escapeHtml(post.Content)}
                    </p>
                </div>

                <div class="flex flex-wrap gap-2">
                   <a href="/post?id=${parseInt(post.AnnouncementId, 10)}"
                       class="px-3 py-2 bg-cyan-500 text-slate-900 text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
                        View Post
                    </a>
                    <a href="/clubadmin/edit-post?id=${parseInt(post.AnnouncementId, 10)}"
                       class="px-3 py-2 bg-yellow-500 text-slate-900 text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
                        Edit
                    </a>
                    <button type="button" data-id="${parseInt(post.AnnouncementId, 10)}" data-title="${escapeHtml(post.Title)}" onclick="deletePost(parseInt(this.dataset.id, 10), this.dataset.title)"
                            class="px-3 py-2 bg-red-500 text-white text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
                        Delete
                    </button>
                </div>
            </div>
        `).join('');
    }

    async function deletePost(postId, title) {
        if (!confirm(`Are you sure you want to delete "${title}"?\n\nThis action cannot be undone.`)) {
            return;
        }
        
        try {
            const response = await authenticatedFetch(`/api/announcements.php?id=${postId}`, {
                method: 'DELETE'
            });
            
            const result = await response.json();
            
            if (result.success) {
                alert('Post deleted successfully!');
                loadPosts();
            } else {
                alert('Error: ' + (result.message || 'Failed to delete post'));
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error deleting post. Please try again.');
        }
    }
    </script>
    <script src="/js/session-manager.js"></script>
</body>
</html>
