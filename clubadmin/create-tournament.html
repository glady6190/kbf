<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create tournament - KBF-UK Admin</title>
    <meta name="robots" content="noindex">
    <script>
    // The organiser area has been retired. Creating a tournament is now the
    // "Create tournament" form on the admin Tournaments page (?create=1);
    // ?edit=ID opens that tournament's details there (?id=ID).
    (function () {
        var edit = new URLSearchParams(window.location.search).get('edit');
        var target = edit && /^\d+$/.test(edit)
            ? '/admin/tournaments?id=' + encodeURIComponent(edit)
            : '/admin/tournaments?create=1';
        window.location.replace(target + window.location.hash);
    })();
    </script>
    <style>body { background: #020617; color: #e5e7eb; font-family: system-ui, sans-serif; padding: 2rem; } a { color: #10b981; font-weight: 700; }</style>
</head>
<body>
    <p>This page has moved to <a href="/admin/tournaments?create=1">Tournaments</a>.</p>
</body>
</html>
