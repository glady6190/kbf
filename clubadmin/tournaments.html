<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tournaments - Organiser</title>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .theme-switcher-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .theme-switcher-btn:hover { transform: scale(1.1); border-color: white; }
        .theme-switcher-btn.active { border-color: white; box-shadow: 0 0 10px currentColor; }
        .theme-switcher-btn.active::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 12px; }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
        .tournament-card { 
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%); 
            transition: all 0.3s ease; 
            position: relative;
            overflow: hidden;
        }
        .tournament-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            transition: left 0.5s;
        }
        .tournament-card:hover::before {
            left: 100%;
        }
        .tournament-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); 
        }
        
        .action-btn {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        @media (max-width: 768px) {
            .theme-switcher-btn { width: 24px; height: 24px; }
            .theme-switcher-btn.active::after { font-size: 10px; }
            .brutal-shadow { box-shadow: 3px 3px 0px var(--theme-primary); }
            .brutal-shadow:hover { box-shadow: 4px 4px 0px var(--theme-primary); }
            .tournament-card:hover { transform: translateY(-2px); }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black uppercase mb-2">
                    <span class="theme-primary-text">My</span> Tournaments
                </h1>
                <div class="h-2 w-32 theme-primary-bg mb-3"></div>
                <p class="text-gray-400 font-bold uppercase text-sm">Manage the tournaments you created</p>
            </div>
            <a href="/clubadmin/create-tournament" 
               class="w-full sm:w-auto theme-primary-bg text-slate-900 px-6 py-3 text-center font-black uppercase text-sm brutal-shadow transition-all hover:opacity-90">
                + Create Tournament
            </a>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-4 border-gray-700 border-t-emerald-500 mb-4"></div>
            <p class="text-gray-400 font-bold uppercase text-sm">Loading tournaments...</p>
        </div>

        <!-- Tournaments Grid -->
        <div id="tournamentsList" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

        <!-- No Tournaments State -->
        <div id="noTournaments" class="hidden bg-slate-900 border-4 border-gray-700 p-16 text-center">
            <div class="inline-flex items-center justify-center w-32 h-32 theme-primary-bg border-4 border-gray-700 mb-6">
                <svg class="w-16 h-16 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                </svg>
            </div>
            <h3 class="text-3xl font-black text-white mb-3 uppercase">No Tournaments Yet</h3>
            <p class="text-gray-400 font-bold mb-6 uppercase text-lg">Create your first tournament to get started</p>
            <a href="/clubadmin/create-tournament" 
               class="inline-block theme-primary-bg text-slate-900 px-8 py-4 font-black uppercase text-sm brutal-shadow transition-all">
                Create First Tournament →
            </a>
        </div>
    </div>

    <script src="/js/escape.js"></script>
    <script src="/js/admin-shell.js"></script>
    <script>
    // ============================================
    // Page guard and shared header
    // ============================================
    KBFShell.start({ anyOf: ['tournaments.organise_own'], active: 'my-tournaments' }).then(function (user) {
        window.kbfUser = user;
        loadTournaments();
    });

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    function getStatusColor(status) {
        const colors = {
            'Approved': 'bg-green-500',
            'Completed': 'bg-blue-500',
            'Pending': 'bg-yellow-500',
            'Rejected': 'bg-red-500'
        };
        return colors[status] || 'bg-gray-500';
    }
    
    function getStatusIcon(status) {
        const icons = {
            'Approved': '✓',
            'Completed': '★',
            'Pending': '…',
            'Rejected': '✗'
        };
        return icons[status] || '•';
    }

    // "Edit details" opens the create form in edit mode (poster, registration, contact)
    function editDetailsLink(tournamentId) {
        const id = parseInt(tournamentId, 10);
        if (!id) return '';
        return `
        <a href="/clubadmin/create-tournament?edit=${id}"
           class="inline-flex items-center gap-1.5 px-3 py-2 bg-slate-800 text-white text-center font-black uppercase text-xs border-2 border-gray-700 hover:border-gray-500 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Edit details
        </a>`;
    }

    // ============================================
    // DATA LOADING FUNCTIONS
    // ============================================
    async function loadTournaments() {
        try {
            const response = await authenticatedFetch('/api/tournaments.php?mine=1');
            const data = await response.json();

            document.getElementById('loading').classList.add('hidden');

            if (data.success) {
                if (data.tournaments.length === 0) {
                    document.getElementById('noTournaments').classList.remove('hidden');
                } else {
                    document.getElementById('tournamentsList').classList.remove('hidden');
                    displayTournaments(data.tournaments);
                }
            }
        } catch (error) {
            console.error('Error loading tournaments:', error);
            document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold uppercase text-lg">Error Loading Tournaments</p>';
        }
    }

    function displayTournaments(tournaments) {
        const container = document.getElementById('tournamentsList');

        const user = window.kbfUser;
        const canPhotos = !!(user && (user.has('content.own_news_gallery') || user.has('content.all_news_gallery')));
        const canPosts = !!(user && user.has('content.own_news_gallery'));

        function photosButton(t) {
            if (!canPhotos) return '';
            return `
        <button type="button" data-id="${parseInt(t.TournamentId, 10)}" data-name="${escapeHtml(t.Name)}" onclick="showUploadModal(parseInt(this.dataset.id, 10), this.dataset.name)"
                class="px-3 py-2 bg-cyan-500 text-slate-900 text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            Photos
        </button>`;
        }

        function postsLink() {
            if (!canPosts) return '';
            return `
        <a href="/clubadmin/posts"
           class="px-3 py-2 bg-purple-500 text-white text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            Posts
        </a>`;
        }

        container.innerHTML = tournaments.map(tournament => {
            const hasMatches = (parseInt(tournament.MatchCount, 10) || 0) > 0 || (parseInt(tournament.HasMatches, 10) || 0) > 0;
            const organiser = tournament.OrganiserName || tournament.ClubName || '';
            return `
            <div class="tournament-card border-4 border-gray-700 p-6">
                <!-- Header -->
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <h3 class="text-2xl font-black text-white uppercase mb-2 line-clamp-2">
                            ${escapeHtml(tournament.Name)}
                        </h3>
                        <div class="inline-flex items-center gap-2 px-3 py-1 ${getStatusColor(tournament.Status)} text-white font-black uppercase text-xs">
                            <span>${getStatusIcon(tournament.Status)}</span>
                            <span>${escapeHtml(tournament.Status)}</span>
                        </div>
                    </div>
                </div>

                <!-- Details Grid -->
                <div class="grid grid-cols-1 gap-3 mb-6 pb-6 border-b-2 border-gray-700">
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 theme-primary-text flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <div>
                            <p class="text-gray-400 uppercase text-xs font-bold mb-1">Tournament Date</p>
                            <p class="text-white font-bold">
                                ${new Date(tournament.TournamentDate).toLocaleDateString('en-GB', { 
                                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
                                })}
                            </p>
                        </div>
                    </div>

                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 theme-primary-text flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <div>
                            <p class="text-gray-400 uppercase text-xs font-bold mb-1">Venue & Location</p>
                            <p class="text-white font-bold">${escapeHtml(tournament.Venue)}, ${escapeHtml(tournament.Location)}</p>
                        </div>
                    </div>
                    ${organiser ? `
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 theme-primary-text flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <div>
                            <p class="text-gray-400 uppercase text-xs font-bold mb-1">Organiser</p>
                            <p class="text-white font-bold">${escapeHtml(organiser)}</p>
                        </div>
                    </div>` : ''}
                </div>

                <!-- Action Buttons -->
<div class="flex flex-wrap gap-2">
    ${tournament.Status === 'Pending' ? `
        <span class="px-3 py-2 bg-gray-700 text-gray-400 text-center font-black uppercase text-xs border-2 border-gray-600">
            Awaiting Approval
        </span>
        ${editDetailsLink(tournament.TournamentId)}
    ` : tournament.Status === 'Approved' && !hasMatches ? `
        <a href="/clubadmin/submit-results?id=${parseInt(tournament.TournamentId, 10)}"
           class="px-3 py-2 theme-primary-bg text-slate-900 text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            Submit Results
        </a>
        ${editDetailsLink(tournament.TournamentId)}
        ${postsLink()}
    ` : tournament.Status === 'Approved' && hasMatches ? `
        <a href="/tournament-details?id=${parseInt(tournament.TournamentId, 10)}"
           class="px-3 py-2 bg-blue-500 text-white text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            View Results
        </a>
        ${editDetailsLink(tournament.TournamentId)}
        <a href="/clubadmin/submit-results?id=${parseInt(tournament.TournamentId, 10)}"
           class="px-3 py-2 bg-green-500 text-slate-900 text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            Submit More Results
        </a>
        ${photosButton(tournament)}
        ${postsLink()}
    ` : tournament.Status === 'Completed' ? `
        <a href="/tournament-details?id=${parseInt(tournament.TournamentId, 10)}"
           class="px-3 py-2 bg-blue-500 text-white text-center font-black uppercase text-xs border-2 border-gray-700 hover:opacity-80 transition">
            View Details
        </a>
        ${photosButton(tournament)}
        ${postsLink()}
    ` : ''}
</div>
            </div>
        `;
        }).join('');
    }

    // ============================================
    // PHOTO UPLOAD FUNCTIONALITY
    // ============================================
    let selectedPhotos = [];
    let currentTournamentId = null;

    function showUploadModal(tournamentId, tournamentName) {
        currentTournamentId = tournamentId;
        document.getElementById('uploadTournamentId').value = tournamentId;
        document.getElementById('modalTournamentName').textContent = tournamentName;
        document.getElementById('uploadPhotosModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
        
        // Reset form
        selectedPhotos = [];
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreviewContainer').classList.add('hidden');
        document.getElementById('uploadMessage').classList.add('hidden');
        document.getElementById('uploadProgress').classList.add('hidden');
        
        // Initialize form listener
        initializeUploadForm();
    }

    function closeUploadModal() {
        document.getElementById('uploadPhotosModal').classList.add('hidden');
        document.body.style.overflow = 'auto';
        selectedPhotos = [];
        document.getElementById('photoInput').value = '';
        document.getElementById('photoPreviewContainer').classList.add('hidden');
        document.getElementById('uploadMessage').classList.add('hidden');
    }

    function previewPhotos(event) {
        const files = Array.from(event.target.files);
        
        // Validate file count
        if (files.length > 10) {
            showUploadMessage('Maximum 10 photos allowed', 'error');
            event.target.value = '';
            return;
        }
        
        // Validate each file
        for (let file of files) {
            // Check file size (Site settings, 15MB by default)
            const galleryMb = KBFShell.uploadLimitMb('gallery', 15);
            if (file.size > galleryMb * 1024 * 1024) {
                showUploadMessage(`${file.name} exceeds ${galleryMb}MB limit`, 'error');
                event.target.value = '';
                return;
            }
            
            // Check file type
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
                showUploadMessage(`${file.name} is not a valid image format`, 'error');
                event.target.value = '';
                return;
            }
        }
        
        selectedPhotos = files;
        
        // Show preview container
        document.getElementById('photoPreviewContainer').classList.remove('hidden');
        document.getElementById('photoCount').textContent = files.length;
        
        // Generate previews
        const previewGrid = document.getElementById('photoPreviewGrid');
        previewGrid.innerHTML = '';
        
        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.createElement('div');
                preview.className = 'relative border-2 border-gray-700 bg-slate-800 overflow-hidden';
                preview.innerHTML = `
                    <img src="${escapeHtml(e.target.result)}" alt="Preview ${Number(index) + 1}" class="w-full h-24 object-cover">
                    <button type="button" onclick="removePhoto(${Number(index)})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 hover:bg-red-600 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-70 px-2 py-1">
                        <p class="text-xs text-white font-bold truncate">${escapeHtml(file.name)}</p>
                    </div>
                `;
                previewGrid.appendChild(preview);
            };
            reader.readAsDataURL(file);
        });
    }

    function removePhoto(index) {
        // Create new FileList without the removed photo
        const dt = new DataTransfer();
        selectedPhotos.forEach((file, i) => {
            if (i !== index) {
                dt.items.add(file);
            }
        });
        
        document.getElementById('photoInput').files = dt.files;
        previewPhotos({ target: document.getElementById('photoInput') });
    }

    function showUploadMessage(message, type) {
        const messageDiv = document.getElementById('uploadMessage');
        messageDiv.className = `p-3 sm:p-4 border-2 sm:border-4 font-bold uppercase text-xs sm:text-sm ${
            type === 'success' ? 'border-green-500 bg-green-500/20 text-green-400' : 
            type === 'info' ? 'border-blue-500 bg-blue-500/20 text-blue-400' :
            'border-red-500 bg-red-500/20 text-red-400'
        }`;
        messageDiv.textContent = message;
        messageDiv.classList.remove('hidden');
    }

    // Initialize upload form when modal opens
    function initializeUploadForm() {
        setTimeout(() => {
            const uploadForm = document.getElementById('uploadPhotosForm');
            if (!uploadForm) {
                console.error('Upload form not found in DOM');
                return;
            }
            
            
            // Remove any existing listeners (clone and replace)
            const newForm = uploadForm.cloneNode(true);
            uploadForm.parentNode.replaceChild(newForm, uploadForm);
            
            // Attach new event listener
            const form = document.getElementById('uploadPhotosForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (selectedPhotos.length === 0) {
                    showUploadMessage('Please select at least one photo', 'error');
                    return;
                }
                
                const formData = new FormData();
                formData.append('tournamentId', currentTournamentId);
                
                selectedPhotos.forEach((file) => {
                    formData.append('photos[]', file);
                });
                
                // Show progress
                document.getElementById('uploadProgress').classList.remove('hidden');
                document.getElementById('uploadButton').disabled = true;
                showUploadMessage('Uploading photos...', 'info');
                
                try {
                    const response = await fetch('/api/gallery.php', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'X-CSRF-Token': getCSRFToken()
                        },
                        body: formData
                    });
                    
                    
                    // Simulate progress
                    let progress = 0;
                    const progressInterval = setInterval(() => {
                        progress += 10;
                        if (progress <= 90) {
                            document.getElementById('uploadProgressBar').style.width = progress + '%';
                            document.getElementById('uploadProgressBar').textContent = progress + '%';
                        }
                    }, 200);
                    
                    const result = await response.json();
                    
                    clearInterval(progressInterval);
                    document.getElementById('uploadProgressBar').style.width = '100%';
                    document.getElementById('uploadProgressBar').textContent = '100%';
                    
                    if (result.success) {
                        showUploadMessage(result.message, 'success');
                        
                        setTimeout(() => {
                            closeUploadModal();
                        }, 2000);
                    } else {
                        showUploadMessage(result.message || 'Upload failed', 'error');
                        document.getElementById('uploadButton').disabled = false;
                    }
                    
                } catch (error) {
                    console.error('Upload error:', error);
                    showUploadMessage('Upload failed. Please try again.', 'error');
                    document.getElementById('uploadButton').disabled = false;
                }
            });
            
        }, 100);
    }
    async function deletePost(postId, tournamentName) {
    if (!confirm(`Are you sure you want to delete the post for "${tournamentName}"?\n\nThis action cannot be undone.`)) {
        return;
    }
    
    try {
        const response = await authenticatedFetch(`/api/announcements.php?id=${postId}`, {
            method: 'DELETE'
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Post deleted successfully!');
            loadTournaments(); // Reload the list
        } else {
            alert('Error: ' + (result.message || 'Failed to delete post'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error deleting post. Please try again.');
    }
}
    </script>
    <script src="/js/session-manager.js"></script>

    <!-- Upload Photos Modal -->
    <div id="uploadPhotosModal" class="hidden fixed inset-0 bg-black bg-opacity-90 overflow-y-auto h-full w-full z-50 p-4">
        <div class="relative top-4 sm:top-20 mx-auto p-6 border-4 border-gray-700 w-full max-w-3xl bg-slate-900">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-2xl font-black uppercase theme-primary-text">Upload Photos</h3>
                    <p class="text-gray-400 font-bold uppercase text-sm mt-1" id="modalTournamentName">Tournament Name</p>
                </div>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <form id="uploadPhotosForm" class="space-y-4">
                <input type="hidden" id="uploadTournamentId" name="tournamentId">
                
                <!-- File Upload -->
                <div>
                    <label class="block text-xs font-black theme-primary-text uppercase mb-2">
                        Select Photos (Max 10 photos, 15MB each)
                    </label>
                    <div class="flex flex-col gap-3">
                        <label for="photoInput" class="block w-full cursor-pointer">
                            <div class="w-full px-4 py-8 bg-slate-800 border-4 border-dashed border-gray-600 hover:border-emerald-500 text-center transition">
                                <svg class="w-16 h-16 mx-auto mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                </svg>
                                <p class="font-black text-white uppercase text-base mb-2">Click to select photos</p>
                                <p class="text-sm text-gray-400 uppercase">JPG, PNG, WEBP (Max 15MB each)</p>
                            </div>
                        </label>
                        <input type="file" id="photoInput" name="photos[]" accept="image/jpeg,image/png,image/webp" multiple 
                               onchange="previewPhotos(event)" class="hidden">
                    </div>
                </div>

                <!-- Photo Previews -->
                <div id="photoPreviewContainer" class="hidden">
                    <label class="block text-xs font-black theme-primary-text uppercase mb-2">
                        Selected Photos (<span id="photoCount">0</span>/10)
                    </label>
                    <div id="photoPreviewGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
                </div>

                <!-- Upload Message -->
                <div id="uploadMessage" class="hidden p-4 border-4 font-bold uppercase text-sm"></div>

                <!-- Progress Bar -->
                <div id="uploadProgress" class="hidden">
                    <div class="w-full bg-gray-700 border-2 border-gray-600 h-10">
                        <div id="uploadProgressBar" class="theme-primary-bg h-full flex items-center justify-center text-slate-900 font-black text-sm transition-all duration-300" style="width: 0%">
                            0%
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row justify-end gap-3 mt-6">
                    <button type="button" onclick="closeUploadModal()" class="w-full sm:w-auto px-6 py-3 bg-slate-800 border-4 border-gray-700 font-black uppercase text-sm hover:border-gray-600 transition">
                        Cancel
                    </button>
                    <button type="submit" id="uploadButton" class="w-full sm:w-auto px-6 py-3 theme-primary-bg text-slate-900 font-black uppercase text-sm brutal-shadow transition-all">
                        Upload Photos →
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
