<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit news post - KBF-UK Admin</title>
    <meta name="robots" content="noindex">
    <script>
    // The organiser area has been retired. Posts are edited in the admin post
    // editor, with the same ?id= (a post).
    (function () {
        var id = new URLSearchParams(window.location.search).get('id');
        var target = id && /^\d+$/.test(id)
            ? '/admin/post-editor?id=' + encodeURIComponent(id)
            : '/admin/announcements';
        window.location.replace(target + window.location.hash);
    })();
    </script>
    <style>body { background: #020617; color: #e5e7eb; font-family: system-ui, sans-serif; padding: 2rem; } a { color: #10b981; font-weight: 700; }</style>
</head>
<body>
    <p>This page has moved to <a href="/admin/announcements">News</a>.</p>
</body>
</html>
