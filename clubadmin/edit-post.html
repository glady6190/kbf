<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit news post - KBF-UK Admin</title>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .theme-focus:focus { border-color: var(--theme-primary); }
        .theme-spinner { border-top-color: var(--theme-primary); }
        #featuredImage::file-selector-button { background: var(--theme-primary); color: #0F172A; }
        #featuredImage:hover::file-selector-button { opacity: .9; }
        /* Touch targets at least 44 px high */
        .tap { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
        .tap:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
        @media (max-width: 768px) {
            .brutal-shadow { box-shadow: 3px 3px 0px var(--theme-primary); }
            .brutal-shadow:hover { box-shadow: 4px 4px 0px var(--theme-primary); }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-8">
        <div id="loading" class="text-center py-12 sm:py-20" role="status" aria-live="polite">
            <div class="inline-block animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-4 border-gray-700 theme-spinner mb-4" aria-hidden="true"></div>
            <p class="text-gray-400 font-bold uppercase text-sm">Loading...</p>
        </div>

        <div id="postForm" class="hidden">
            <div class="mb-6 sm:mb-8">
                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black uppercase mb-2"><span class="theme-primary-text">Edit</span> News Post</h1>
                <div class="h-2 w-24 sm:w-32 theme-primary-bg mb-4"></div>
                <p class="text-gray-400 font-bold uppercase text-xs sm:text-sm">Tournament: <span id="tournamentName" class="theme-primary-text break-words">--</span></p>
            </div>

            <div class="bg-slate-900 border-2 sm:border-4 border-gray-700 p-4 sm:p-8">
                <form id="createPostForm" enctype="multipart/form-data">
                    <input type="hidden" id="tournamentId" name="tournamentId">
                    <input type="hidden" id="postId" name="postId">

                    <div class="mb-4 sm:mb-6">
                        <label for="tournamentSelect" class="block text-xs font-black theme-primary-text uppercase mb-2">Tournament *</label>
                        <select id="tournamentSelect" required disabled
                                aria-describedby="tournamentSelectHint"
                                class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-bold uppercase text-base sm:text-sm focus:outline-none theme-focus transition disabled:opacity-60 disabled:cursor-not-allowed">
                            <option value="">Select Tournament...</option>
                        </select>
                        <p id="tournamentSelectHint" class="text-xs text-gray-500 mt-2 uppercase font-bold">A post's tournament cannot be changed after it is published</p>
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label for="postTitle" class="block text-xs font-black theme-primary-text uppercase mb-2">Post Title *</label>
                        <input type="text" name="title" id="postTitle" required minlength="3" maxlength="200"
                               class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white placeholder-gray-500 font-bold uppercase text-base sm:text-sm focus:outline-none theme-focus transition"
                               placeholder="AMAZING TOURNAMENT SUCCESS">
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label for="postContent" class="block text-xs font-black theme-primary-text uppercase mb-2">Content *</label>
                        <textarea name="content" id="postContent" required rows="8" minlength="10" maxlength="10000" aria-describedby="postContentHint"
                                  class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white placeholder-gray-500 font-semibold text-base sm:text-sm focus:outline-none theme-focus transition"
                                  placeholder="Write your post content here..."></textarea>
                        <p id="postContentHint" class="text-xs text-gray-500 mt-2 uppercase font-bold">Share highlights, results, and memorable moments</p>
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label for="featuredImage" class="block text-xs font-black theme-primary-text uppercase mb-2">Featured Image</label>
                        <input type="file" name="featuredImage" id="featuredImage" accept="image/*" aria-describedby="featuredImageHint"
                               class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-bold text-xs sm:text-sm focus:outline-none theme-focus transition file:mr-3 file:py-2 file:px-3 file:border-0 file:text-xs file:font-bold file:cursor-pointer">
                        <p id="featuredImageHint" class="text-xs text-gray-500 mt-2 uppercase font-bold">Recommended: 1200x630px (JPG, PNG, max 5MB)</p>
                        
                        <div id="imagePreview" class="hidden mt-3 sm:mt-4">
                            <p class="text-xs font-black theme-primary-text uppercase mb-2">Preview:</p>
                            <div class="border-2 sm:border-4 border-gray-700 p-2 bg-slate-800">
                                <img id="previewImg" src="" alt="Preview" class="w-full h-auto max-h-64 object-contain bg-slate-950">
                            </div>
                            <button type="button" onclick="removeImage()" class="tap mt-2 sm:mt-3 px-3 sm:px-4 py-2 bg-red-500 text-slate-900 font-black uppercase text-xs hover:bg-red-400 transition">Remove image</button>
                        </div>
                    </div>

                    <div id="formMessage" role="alert" class="hidden p-3 sm:p-4 border-2 sm:border-4 mb-4 sm:mb-6 font-bold uppercase text-xs sm:text-sm"></div>

                    <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 sm:pt-6 border-t-2 sm:border-t-4 border-gray-700">
                        <a href="/clubadmin/posts" id="cancelLink"
                           class="tap w-full sm:w-auto px-4 sm:px-6 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-center font-black uppercase text-xs sm:text-sm hover:border-gray-600 transition">
                            Cancel
                        </a>
                        <button type="submit" id="saveBtn"
        class="tap w-full sm:w-auto px-4 sm:px-6 py-2 sm:py-3 theme-primary-bg text-slate-900 font-black uppercase text-xs sm:text-sm brutal-shadow transition-all">
    Save changes
</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/escape.js"></script>
    <script src="/js/kbf-dialog.js"></script>
    <script src="/js/kbf-forms.js"></script>
    <script src="/js/admin-shell.js"></script>
    <script>
    // ============================================
    // Page guard and shared header
    // ============================================
    KBFShell.start({ anyOf: ['content.own_news_gallery', 'content.all_news_gallery'], active: 'my-posts' }).then(function (user) {
        window.kbfUser = user;
        document.getElementById('cancelLink').setAttribute('href', backUrl());

        // Check post ID
        const raw = new URLSearchParams(window.location.search).get('id');
        window.postId = raw && /^\d+$/.test(raw) ? raw : null;

        if (!window.postId) {
            showLoadProblem('This link does not point to a news post.', false);
            return;
        }

        // Load post data
        loadPost();
    });

    // Where to go after saving / cancelling
    function backUrl() {
        const user = window.kbfUser;
        if (user && !user.has('content.own_news_gallery') && user.has('content.all_news_gallery')) return '/admin/announcements';
        return '/clubadmin/posts';
    }

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    // ============================================
    // DATA LOADING FUNCTIONS
    // ============================================
    const loadingHtml = document.getElementById('loading').innerHTML;

    // Loading failed: a message instead of the spinner, with Try again when
    // trying again could help, and a way back to the list
    function showLoadProblem(message, canRetry) {
        const loading = document.getElementById('loading');
        loading.classList.remove('hidden');
        document.getElementById('postForm').classList.add('hidden');
        const box = KBF.showLoadError(loading, {
            message: message,
            retry: canRetry ? loadPost : null
        });
        if (box) {
            const back = document.createElement('a');
            back.href = backUrl();
            back.className = 'tap ml-2 px-4 py-2 font-bold uppercase text-xs text-gray-300 hover:text-white';
            back.textContent = 'Back to the posts';
            box.appendChild(back);
        }
    }

    async function loadPost() {
    const loadingBox = document.getElementById('loading');
    loadingBox.innerHTML = loadingHtml;
    loadingBox.classList.remove('hidden');
    try {
        const response = await authenticatedFetch(`/api/announcements.php?id=${window.postId}`);
        const data = await response.json();

        if (data.success) {
            const post = data.announcement;
            
            // Populate form fields
            document.getElementById('tournamentName').textContent = post.TournamentName || 'Tournament';
            document.getElementById('postId').value = window.postId;
            document.getElementById('tournamentId').value = post.TournamentId;
            await loadTournamentPicker(post);
            document.querySelector('[name="title"]').value = post.Title;
            document.querySelector('[name="content"]').value = post.Content;
            
            // Show existing image if exists
            if (post.FeaturedImage) {
                setImageVariant(document.getElementById('previewImg'), post.FeaturedImage, 'display');
                document.getElementById('imagePreview').classList.remove('hidden');
            }
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('postForm').classList.remove('hidden');
        } else {
            showLoadProblem(data.message ? String(data.message) : 'This news post could not be found.', false);
        }
    } catch (error) {
        console.error('Error:', error);
        showLoadProblem('The news post could not be loaded. Please check your connection and try again.', true);
    }
}

    // Tournament picker: the user's own Approved/Completed tournaments, or every
    // Approved/Completed tournament for holders of content.all_news_gallery.
    async function loadTournamentPicker(post) {
        const select = document.getElementById('tournamentSelect');
        const currentId = post.TournamentId ? String(parseInt(post.TournamentId, 10)) : '';
        while (select.options.length > 1) select.remove(1);
        let eligible = [];
        try {
            const canAll = window.kbfUser && window.kbfUser.has('content.all_news_gallery');
            const response = await authenticatedFetch(canAll ? '/api/tournaments.php' : '/api/tournaments.php?mine=1');
            const data = await response.json();
            if (data.success) {
                eligible = (data.tournaments || []).filter(t => t.Status === 'Approved' || t.Status === 'Completed');
            }
        } catch (error) {
            console.error('Error loading tournaments:', error);
        }

        eligible.forEach(t => {
            const option = document.createElement('option');
            option.value = String(parseInt(t.TournamentId, 10));
            option.textContent = `${t.Name} (${t.Status})`;
            option.dataset.name = t.Name || '';
            select.appendChild(option);
        });

        // Keep the post's current tournament selectable even if it is not in the list
        if (currentId && !eligible.some(t => String(parseInt(t.TournamentId, 10)) === currentId)) {
            const option = document.createElement('option');
            option.value = currentId;
            option.textContent = post.TournamentName || 'Current tournament';
            option.dataset.name = post.TournamentName || '';
            select.appendChild(option);
        }

        select.value = currentId;
        select.addEventListener('change', function () {
            const option = select.options[select.selectedIndex];
            document.getElementById('tournamentId').value = select.value;
            document.getElementById('tournamentName').textContent = (select.value && option) ? (option.dataset.name || option.textContent) : '--';
        });
    }

    // ============================================
    // IMAGE PREVIEW
    // ============================================
    document.getElementById('featuredImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > KBFShell.uploadLimitMb('news', 5) * 1024 * 1024) {
                const messageDiv = document.getElementById('formMessage');
                messageDiv.setAttribute('role', 'alert');
                messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 mb-4 sm:mb-6 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
                messageDiv.textContent = 'The image must be smaller than ' + KBFShell.uploadLimitMb('news', 5) + 'MB.';
                e.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('previewImg').src = event.target.result;
                document.getElementById('imagePreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    });

    function removeImage() {
        document.getElementById('featuredImage').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
    }
    
    // Helper function to convert file to base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        if (!file || file.size === 0) {
            resolve(null);
            return;
        }
        
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

    // ============================================
    // FORM SUBMISSION
    // ============================================
    document.getElementById('createPostForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const saveBtn = document.getElementById('saveBtn');
    if (KBF.isBusy(saveBtn)) return;

    if (!document.getElementById('tournamentId').value) {
        const messageDiv = document.getElementById('formMessage');
        messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
        messageDiv.textContent = 'Please select a tournament first.';
        messageDiv.classList.remove('hidden');
        return;
    }

    const formData = new FormData(e.target);
    // Busy until the request finishes; kept busy after success until the redirect
    const restore = KBF.setBusy(saveBtn, 'Saving...');
    let keepBusy = false;

    try {
        const response = await fetch(`/api/announcements.php?id=${window.postId}`, {
            method: 'PUT',
            credentials: 'include',
            headers: {
                'X-CSRF-Token': getCSRFToken(),
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                postId: window.postId,
                tournamentId: document.getElementById('tournamentId').value,
                title: formData.get('title'),
                content: formData.get('content'),
                featuredImage: formData.get('featuredImage') ? await fileToBase64(formData.get('featuredImage')) : null
            })
        });

            const result = await response.json();
            const messageDiv = document.getElementById('formMessage');

            if (result.success) {
                messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-green-500 bg-green-500/20 text-green-400 font-bold uppercase text-xs sm:text-sm';
                messageDiv.innerHTML = `
    <p class="font-black">News post saved</p>
    <p class="text-xs mt-1">Your changes have been saved.</p>
`;
                messageDiv.setAttribute('role', 'status');
                messageDiv.classList.remove('hidden');
                keepBusy = true;

                setTimeout(() => {
                    window.location.href = backUrl();
                }, 2000);
            } else {
                messageDiv.setAttribute('role', 'alert');
                messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
                messageDiv.textContent = result.message || 'Error saving the post';
                messageDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error:', error);
            const messageDiv = document.getElementById('formMessage');
            messageDiv.setAttribute('role', 'alert');
            messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
            messageDiv.textContent = 'The changes could not be saved. Please check your connection and try again.';
            messageDiv.classList.remove('hidden');
        } finally {
            if (!keepBusy) restore();
        }
    });
</script>
<script src="/js/session-manager.js"></script>
</body>
</html>
