<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Organiser</title>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .theme-switcher-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .theme-switcher-btn:hover { transform: scale(1.1); border-color: white; }
        .theme-switcher-btn.active { border-color: white; box-shadow: 0 0 10px currentColor; }
        .theme-switcher-btn.active::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 12px; }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
        @media (max-width: 768px) {
            .theme-switcher-btn { width: 24px; height: 24px; }
            .theme-switcher-btn.active::after { font-size: 10px; }
            .brutal-shadow { box-shadow: 3px 3px 0px var(--theme-primary); }
            .brutal-shadow:hover { box-shadow: 4px 4px 0px var(--theme-primary); }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-8">
        <div id="loading" class="text-center py-12 sm:py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-4 border-gray-700 border-t-emerald-500 mb-4"></div>
            <p class="text-gray-400 font-bold uppercase text-sm">Loading...</p>
        </div>

        <div id="postForm" class="hidden">
            <div class="mb-6 sm:mb-8">
                <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black uppercase mb-2"><span class="theme-primary-text">Create</span> Tournament Post</h1>
                <div class="h-2 w-24 sm:w-32 theme-primary-bg mb-4"></div>
                <p class="text-gray-400 font-bold uppercase text-xs sm:text-sm">Tournament: <span id="tournamentName" class="theme-primary-text break-words">--</span></p>
            </div>

            <div class="bg-slate-900 border-2 sm:border-4 border-gray-700 p-4 sm:p-8">
                <form id="createPostForm" enctype="multipart/form-data">
                    <input type="hidden" id="tournamentId" name="tournamentId">

                    <div class="mb-4 sm:mb-6">
                        <label for="tournamentSelect" class="block text-xs font-black theme-primary-text uppercase mb-2">Tournament *</label>
                        <select id="tournamentSelect" required
                                class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-bold uppercase text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition">
                            <option value="">Select Tournament...</option>
                        </select>
                        <p class="text-xs text-gray-500 mt-2 uppercase font-bold">Approved or completed tournaments only</p>
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label class="block text-xs font-black theme-primary-text uppercase mb-2">Post Title *</label>
                        <input type="text" name="title" required 
                               class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white placeholder-gray-500 font-bold uppercase text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition"
                               placeholder="AMAZING TOURNAMENT SUCCESS">
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label class="block text-xs font-black theme-primary-text uppercase mb-2">Content *</label>
                        <textarea name="content" required rows="8" 
                                  class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white placeholder-gray-500 font-semibold text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition"
                                  placeholder="Write your post content here..."></textarea>
                        <p class="text-xs text-gray-500 mt-2 uppercase font-bold">Share highlights, results, and memorable moments</p>
                    </div>

                    <div class="mb-4 sm:mb-6">
                        <label class="block text-xs font-black theme-primary-text uppercase mb-2">Featured Image</label>
                        <input type="file" name="featuredImage" id="featuredImage" accept="image/*"
                               class="w-full px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-bold text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition file:mr-3 file:py-2 file:px-3 file:border-0 file:text-xs file:font-bold file:bg-emerald-500 file:text-slate-900 hover:file:bg-emerald-400 file:cursor-pointer">
                        <p class="text-xs text-gray-500 mt-2 uppercase font-bold">Recommended: 1200x630px (JPG, PNG, max 5MB)</p>
                        
                        <div id="imagePreview" class="hidden mt-3 sm:mt-4">
                            <p class="text-xs font-black theme-primary-text uppercase mb-2">Preview:</p>
                            <div class="border-2 sm:border-4 border-gray-700 p-2 bg-slate-800">
                                <img id="previewImg" src="" alt="Preview" class="w-full h-auto max-h-64 object-contain bg-slate-950">
                            </div>
                            <button type="button" onclick="removeImage()" class="mt-2 sm:mt-3 px-3 sm:px-4 py-2 bg-red-500 text-white font-black uppercase text-xs hover:bg-red-600 transition">Remove Image</button>
                        </div>
                    </div>

                    <div id="formMessage" class="hidden p-3 sm:p-4 border-2 sm:border-4 mb-4 sm:mb-6 font-bold uppercase text-xs sm:text-sm"></div>

                    <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 sm:pt-6 border-t-2 sm:border-t-4 border-gray-700">
                        <a href="/clubadmin/posts" id="cancelLink"
                           class="w-full sm:w-auto px-4 sm:px-6 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-center font-black uppercase text-xs sm:text-sm hover:border-gray-600 transition">
                            Cancel
                        </a>
                        <button type="submit" 
                                class="w-full sm:w-auto px-4 sm:px-6 py-2 sm:py-3 theme-primary-bg text-slate-900 font-black uppercase text-xs sm:text-sm brutal-shadow transition-all">
                            Publish Post →
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/escape.js"></script>
    <script src="/js/admin-shell.js"></script>
    <script>
    // ============================================
    // Page guard and shared header
    // ============================================
    KBFShell.start({ anyOf: ['content.own_news_gallery', 'content.all_news_gallery'], active: 'my-posts' }).then(function (user) {
        window.kbfUser = user;
        document.getElementById('cancelLink').setAttribute('href', backUrl());

        // Optional ?id= pre-selects a tournament in the picker
        const raw = new URLSearchParams(window.location.search).get('id');
        window.tournamentId = raw && /^\d+$/.test(raw) ? raw : null;

        loadTournament();
    });

    // Where to go after publishing / cancelling
    function backUrl() {
        const user = window.kbfUser;
        if (user && !user.has('content.own_news_gallery') && user.has('content.all_news_gallery')) return '/admin/announcements';
        return '/clubadmin/posts';
    }

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    // ============================================
    // DATA LOADING FUNCTIONS
    // ============================================
    // Tournament picker: the user's own Approved/Completed tournaments, or every
    // Approved/Completed tournament for holders of content.all_news_gallery.
    async function loadTournament() {
        try {
            const canAll = window.kbfUser && window.kbfUser.has('content.all_news_gallery');
            const response = await authenticatedFetch(canAll ? '/api/tournaments.php' : '/api/tournaments.php?mine=1');
            const data = await response.json();

            if (!data.success) {
                alert(data.message || 'Error loading tournaments');
                window.location.href = backUrl();
                return;
            }

            const eligible = (data.tournaments || []).filter(t => t.Status === 'Approved' || t.Status === 'Completed');
            const select = document.getElementById('tournamentSelect');
            eligible.forEach(t => {
                const option = document.createElement('option');
                option.value = String(parseInt(t.TournamentId, 10));
                option.textContent = `${t.Name} (${t.Status})`;
                option.dataset.name = t.Name || '';
                select.appendChild(option);
            });

            if (window.tournamentId && eligible.some(t => String(t.TournamentId) === String(window.tournamentId))) {
                select.value = String(parseInt(window.tournamentId, 10));
            }
            syncTournament();
            select.addEventListener('change', syncTournament);

            if (eligible.length === 0) {
                showMessage('error', 'No approved or completed tournaments are available for a post yet.');
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('postForm').classList.remove('hidden');
        } catch (error) {
            console.error('Error:', error);
            alert('Error loading tournaments');
        }
    }

    function syncTournament() {
        const select = document.getElementById('tournamentSelect');
        const option = select.options[select.selectedIndex];
        document.getElementById('tournamentId').value = select.value;
        document.getElementById('tournamentName').textContent = (select.value && option) ? (option.dataset.name || option.textContent) : '--';
    }

    function showMessage(type, text) {
        const messageDiv = document.getElementById('formMessage');
        messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 mb-4 sm:mb-6 font-bold uppercase text-xs sm:text-sm ' + (type === 'success'
            ? 'border-green-500 bg-green-500/20 text-green-400'
            : 'border-red-500 bg-red-500/20 text-red-400');
        messageDiv.textContent = text;
        messageDiv.classList.remove('hidden');
    }

    // ============================================
    // IMAGE PREVIEW
    // ============================================
    document.getElementById('featuredImage').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            if (file.size > KBFShell.uploadLimitMb('news', 5) * 1024 * 1024) {
                alert('Image size must be less than ' + KBFShell.uploadLimitMb('news', 5) + 'MB');
                e.target.value = '';
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(event) {
                document.getElementById('previewImg').src = event.target.result;
                document.getElementById('imagePreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    });

    function removeImage() {
        document.getElementById('featuredImage').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
    }

    // ============================================
    // FORM SUBMISSION
    // ============================================
    document.getElementById('createPostForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!document.getElementById('tournamentId').value) {
            showMessage('error', 'Please select a tournament first.');
            return;
        }

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/api/announcements.php', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'X-CSRF-Token': getCSRFToken()
                },
                body: formData
            });

            const result = await response.json();
            const messageDiv = document.getElementById('formMessage');

            if (result.success) {
                messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-green-500 bg-green-500/20 text-green-400 font-bold uppercase text-xs sm:text-sm';
                messageDiv.innerHTML = `
                    <p class="font-black">Post Published Successfully!</p>
                    <p class="text-xs mt-1">Your post is now visible to the public.</p>
                `;
                messageDiv.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = backUrl();
                }, 2000);
            } else {
                messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
                messageDiv.textContent = result.message || 'Error publishing post';
                messageDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error:', error);
            const messageDiv = document.getElementById('formMessage');
            messageDiv.className = 'p-3 sm:p-4 border-2 sm:border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-xs sm:text-sm';
            messageDiv.textContent = 'Error publishing post. Please try again.';
            messageDiv.classList.remove('hidden');
        }
    });
</script>
<script src="/js/session-manager.js"></script>
</body>
</html>
