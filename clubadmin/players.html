<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players - Organiser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .theme-switcher-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .theme-switcher-btn:hover { transform: scale(1.1); border-color: white; }
        .theme-switcher-btn.active { border-color: white; box-shadow: 0 0 10px currentColor; }
        .theme-switcher-btn.active::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 12px; }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
        
        .user-photo { width: 48px; height: 48px; object-fit: cover; }
        
        /* Checkbox styling */
        .player-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--theme-primary);
        }
        
        .select-all-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--theme-primary);
        }
        
        /* Selection bar */
        .selection-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border-top: 4px solid var(--theme-primary);
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 40;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .selection-bar.active {
            transform: translateY(0);
        }
        
        @media (max-width: 768px) {
            .theme-switcher-btn { width: 24px; height: 24px; }
            .theme-switcher-btn.active::after { font-size: 10px; }
            .brutal-shadow { box-shadow: 3px 3px 0px var(--theme-primary); }
            .brutal-shadow:hover { box-shadow: 4px 4px 0px var(--theme-primary); }
            .user-photo { width: 40px; height: 40px; }
            .player-checkbox { width: 18px; height: 18px; }
            .select-all-checkbox { width: 20px; height: 20px; }
        }
    </style>
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-8 pb-32">
        <div class="mb-6 sm:mb-8">
            <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black uppercase mb-2"><span class="theme-primary-text">All</span> Players</h1>
            <div class="h-2 w-24 sm:w-32 theme-primary-bg mb-4"></div>
            <p class="text-gray-400 font-bold uppercase text-xs sm:text-sm">View and export player contact information</p>
        </div>

        <!-- Filters - Responsive Grid -->
        <div class="bg-slate-900 border-2 sm:border-4 border-gray-700 p-4 sm:p-6 mb-6 sm:mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                <input type="text" id="searchInput" placeholder="SEARCH NAME, EMAIL OR ID..." 
                       class="px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white placeholder-gray-500 font-bold uppercase text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition">
                
                <select id="categoryFilter" class="px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-bold uppercase text-xs sm:text-sm focus:outline-none focus:border-emerald-500 transition">
                    <option value="">All Categories</option>
                    <option value="A">Category A</option>
                    <option value="B">Category B</option>
                    <option value="C">Category C</option>
                    <option value="D">Category D</option>
                    <option value="E">Category E</option>
                </select>

                <button id="clearSelectionBtn" onclick="clearSelection()" class="px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-gray-400 font-bold uppercase text-xs sm:text-sm hover:text-white hover:border-gray-600 transition">
                    Clear Selection
                </button>

                <div id="selectAllWrap" class="flex items-center gap-2 px-3 sm:px-4 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700">
    <input type="checkbox" id="selectAllCheckbox" class="select-all-checkbox" onclick="toggleSelectAll(event)">
    <label for="selectAllCheckbox" class="text-white font-bold uppercase text-xs sm:text-sm cursor-pointer">Select All</label>
</div>
            </div>
        </div>

        <!-- Players Table - Responsive -->
        <div class="bg-slate-900 border-2 sm:border-4 border-gray-700">
            <div class="p-4 sm:p-6">
                <div id="loadingMessage" class="text-center py-12">
                    <div class="inline-block animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-4 border-gray-700 border-t-emerald-500 mb-4"></div>
                    <p class="text-gray-400 font-bold uppercase text-sm">Loading players...</p>
                </div>
                <div id="playersTable" class="hidden overflow-x-auto">
                    <table class="min-w-full">
                        <thead class="bg-slate-800 border-b-2 sm:border-b-4 border-gray-700">
                            <tr>
                                <th id="selectHeader" class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase">
    <input type="checkbox" id="headerSelectAll" class="select-all-checkbox" onclick="toggleSelectAll(event)">
</th>
                                <th class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase">Photo</th>
                                <th class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase">Name</th>
                                <th id="phoneHeader" class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase hidden lg:table-cell">Phone</th>
                                <th class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase">Category</th>
                                <th class="px-3 sm:px-6 py-2 sm:py-3 text-left text-xs font-black theme-primary-text uppercase hidden sm:table-cell">Location</th>
                            </tr>
                        </thead>
                        <tbody id="playersTableBody" class="divide-y divide-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Selection Action Bar (Fixed at bottom) -->
    <div id="selectionBar" class="selection-bar">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
                <div class="flex items-center gap-3">
                    <div class="flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 theme-primary-bg border-2 sm:border-4 border-gray-700">
                        <span id="selectedCount" class="text-slate-900 font-black text-base sm:text-lg">0</span>
                    </div>
                    <div>
                        <p class="text-white font-black uppercase text-xs sm:text-sm">Players Selected</p>
                        <p class="text-gray-400 font-bold uppercase text-xs">Ready to export contacts</p>
                    </div>
                </div>
                <div class="flex gap-2 sm:gap-3 w-full sm:w-auto">
                    <button onclick="clearSelection()" class="flex-1 sm:flex-none px-4 sm:px-6 py-2 sm:py-3 bg-slate-800 border-2 sm:border-4 border-gray-700 text-white font-black uppercase text-xs sm:text-sm hover:border-gray-600 transition">
                        Clear
                    </button>
                    <button onclick="downloadVCF()" class="flex-1 sm:flex-none px-4 sm:px-6 py-2 sm:py-3 theme-primary-bg text-slate-900 font-black uppercase text-xs sm:text-sm brutal-shadow transition-all">
                        <svg class="w-4 h-4 inline-block align-[-3px] mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Download Contacts (.vcf)
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="/js/escape.js"></script>
<script src="/js/admin-shell.js"></script>
    <script>
    // ============================================
    // Page guard + shared header (js/admin-shell.js)
    // ============================================
    KBFShell.start({ anyOf: ['tournaments.organise_own', 'players.view_export'], active: 'players' }).then(function (user) {
        window.kbfUser = user;

        // Phone numbers and the contacts download need players.contact_details
        showContacts = user.has('players.contact_details');
        if (!showContacts) {
            ['clearSelectionBtn', 'selectAllWrap', 'selectHeader', 'phoneHeader', 'selectionBar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });
        }

        // Load players
        loadPlayers();
    });

    // ============================================
    // GLOBAL VARIABLES
    // ============================================
    let allPlayers = [];
    let selectedPlayers = new Set();
    let showContacts = false;

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    // ============================================
    // DATA LOADING FUNCTIONS
    // ============================================
    async function loadPlayers() {
        const category = document.getElementById('categoryFilter').value;
        const search = document.getElementById('searchInput').value;

        try {
            // No club or role filter: show the player list the API returns
            const params = new URLSearchParams();
            if (category) params.set('category', category);
            if (search) params.set('search', search);
            const query = params.toString();
            const url = '/api/users.php' + (query ? '?' + query : '');

            const response = await authenticatedFetch(url);
            const data = await response.json();

            if (data.success) {
                allPlayers = data.users || [];
                displayPlayers();
            }
        } catch (error) {
            console.error('Error loading players:', error);
            document.getElementById('loadingMessage').innerHTML = '<p class="text-red-400 font-bold uppercase text-sm">Error loading players</p>';
        }
    }

    function displayPlayers() {
        const tbody = document.getElementById('playersTableBody');
        const loadingMessage = document.getElementById('loadingMessage');
        const playersTable = document.getElementById('playersTable');

        loadingMessage.classList.add('hidden');
        playersTable.classList.remove('hidden');

        if (allPlayers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400 font-bold uppercase text-sm">No players found</td></tr>';
            return;
        }

        tbody.innerHTML = allPlayers.map(player => `
            <tr class="hover:bg-slate-800 transition">
                ${showContacts ? `
                <td class="px-3 sm:px-6 py-3 sm:py-4">
                    <input type="checkbox"
                           class="player-checkbox"
                           data-player-id="${Number(player.UserId)}"
                           ${selectedPlayers.has(player.UserId) ? 'checked' : ''}
                           onchange="togglePlayerSelection(${Number(player.UserId)})">
                </td>` : ''}
                <td class="px-3 sm:px-6 py-3 sm:py-4">
                    ${player.ProfilePhoto ?
                        `<img src="${escapeHtml(safeUrl(player.ProfilePhoto))}" alt="${escapeHtml(player.FirstName)}" class="user-photo border-2 border-gray-700">` :
                        `<div class="user-photo bg-slate-800 border-2 border-gray-700 flex items-center justify-center">
                            <span class="text-gray-500 font-black text-xs">${escapeHtml((player.FirstName || '').charAt(0))}${escapeHtml((player.LastName || '').charAt(0))}</span>
                        </div>`
                    }
                </td>
                <td class="px-3 sm:px-6 py-3 sm:py-4">
                    <div class="text-xs sm:text-sm font-black text-white uppercase break-words">${escapeHtml(player.FirstName)} ${escapeHtml(player.LastName)}</div>
                    ${player.PlayerId ? `<div class="text-xs text-gray-400 font-semibold mt-1">ID: ${escapeHtml(player.PlayerId)}</div>` : ''}
                    ${showContacts && player.PhoneNumber ? `<div class="text-xs text-gray-500 font-semibold mt-1 lg:hidden"><svg class="w-3 h-3 inline-block align-[-1px] mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>${escapeHtml(player.PhoneNumber)}</div>` : ''}
                </td>
                ${showContacts ? `<td class="px-3 sm:px-6 py-3 sm:py-4 text-xs sm:text-sm text-gray-300 font-semibold hidden lg:table-cell">${player.PhoneNumber ? escapeHtml(player.PhoneNumber) : '-'}</td>` : ''}
                <td class="px-3 sm:px-6 py-3 sm:py-4">
                    <span class="px-2 sm:px-3 py-1 text-xs font-black uppercase border-2 ${player.CategoryName ? 'bg-indigo-500 text-slate-900 border-gray-700' : 'bg-gray-700 text-gray-400 border-gray-600'}">
                        ${player.CategoryName ? escapeHtml(player.CategoryName) : '-'}
                    </span>
                </td>
                <td class="px-3 sm:px-6 py-3 sm:py-4 text-xs sm:text-sm text-gray-300 font-semibold hidden sm:table-cell">${escapeHtml(player.Location)}</td>
            </tr>
        `).join('');

        updateSelectionUI();
    }

    // ============================================
    // SELECTION FUNCTIONS
    // ============================================
    function togglePlayerSelection(playerId) {
        if (selectedPlayers.has(playerId)) {
            selectedPlayers.delete(playerId);
        } else {
            selectedPlayers.add(playerId);
        }
        updateSelectionUI();
    }

    function toggleSelectAll(event) {
        const clickedCheckbox = event ? event.target : document.getElementById('selectAllCheckbox');
        const isChecked = clickedCheckbox.checked;
        
        const checkbox = document.getElementById('selectAllCheckbox');
        const headerCheckbox = document.getElementById('headerSelectAll');
        checkbox.checked = isChecked;
        headerCheckbox.checked = isChecked;

        if (isChecked) {
            allPlayers.forEach(player => selectedPlayers.add(player.UserId));
        } else {
            selectedPlayers.clear();
        }

        document.querySelectorAll('.player-checkbox').forEach(cb => {
            const playerId = parseInt(cb.dataset.playerId);
            cb.checked = selectedPlayers.has(playerId);
        });

        updateSelectionUI();
    }

    function clearSelection() {
        selectedPlayers.clear();
        document.querySelectorAll('.player-checkbox').forEach(cb => cb.checked = false);
        document.getElementById('selectAllCheckbox').checked = false;
        document.getElementById('headerSelectAll').checked = false;
        updateSelectionUI();
    }

    function updateSelectionUI() {
        // Selection is only for the contacts download (players.contact_details)
        if (!showContacts) return;

        const selectionBar = document.getElementById('selectionBar');
        const selectedCount = document.getElementById('selectedCount');
        const selectAllCheckbox = document.getElementById('selectAllCheckbox');
        const headerSelectAll = document.getElementById('headerSelectAll');

        selectedCount.textContent = selectedPlayers.size;

        if (selectedPlayers.size > 0) {
            selectionBar.classList.add('active');
        } else {
            selectionBar.classList.remove('active');
        }

        const allSelected = allPlayers.length > 0 && selectedPlayers.size === allPlayers.length;
        selectAllCheckbox.checked = allSelected;
        headerSelectAll.checked = allSelected;
    }

    // ============================================
    // VCF DOWNLOAD
    // ============================================
    function downloadVCF() {
        // The contacts download needs players.contact_details
        if (!showContacts) return;

        if (selectedPlayers.size === 0) {
            alert('Please select at least one player to download contacts.');
            return;
        }

        const selectedPlayerData = allPlayers.filter(player => selectedPlayers.has(player.UserId));
        const vcfContent = generateVCF(selectedPlayerData);

        const blob = new Blob([vcfContent], { type: 'text/vcard;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `badminton_players_${new Date().toISOString().split('T')[0]}.vcf`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);

        showSuccessMessage(`Downloaded ${selectedPlayers.size} contact(s) successfully!`);
        
        setTimeout(() => {
            clearSelection();
        }, 500);
    }

    function generateVCF(players) {
        let vcf = '';

        players.forEach(player => {
            vcf += 'BEGIN:VCARD\r\n';
            vcf += 'VERSION:3.0\r\n';
            
            vcf += `FN:${player.FirstName} ${player.LastName}\r\n`;
            vcf += `N:${player.LastName};${player.FirstName};;;\r\n`;
            
            if (player.PhoneNumber) {
                const cleanPhone = player.PhoneNumber.replace(/[\s\-\(\)]/g, '');
                vcf += `TEL;TYPE=CELL:${cleanPhone}\r\n`;
            }
            
            vcf += 'END:VCARD\r\n';
        });

        return vcf;
    }

    function showSuccessMessage(message) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'fixed top-4 right-4 z-50 px-6 py-4 bg-green-500 border-4 border-gray-700 text-slate-900 font-black uppercase text-sm shadow-lg';
        messageDiv.textContent = message;
        document.body.appendChild(messageDiv);

        setTimeout(() => {
            messageDiv.remove();
        }, 3000);
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    document.getElementById('searchInput').addEventListener('input', loadPlayers);
    document.getElementById('categoryFilter').addEventListener('change', loadPlayers);
</script>
<script src="/js/session-manager.js"></script>
</body>
</html>
