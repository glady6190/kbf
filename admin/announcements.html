<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Announcements - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"] { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="orange"] { --theme-primary: #f97316; --theme-secondary: #ea580c; --theme-light: #fb923c; }
        .theme-primary-bg { background-color: var(--theme-primary); }
        .theme-primary-text { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
        .brutal-shadow { box-shadow: 6px 6px 0px var(--theme-primary); }
        .brutal-shadow:hover { box-shadow: 8px 8px 0px var(--theme-primary); transform: translate(-2px, -2px); }
    </style>
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">
    <div id="kbf-admin-header"></div>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8">
            <h1 class="text-4xl font-black uppercase mb-2"><span class="theme-primary-text">Post</span> Announcement</h1>
            <div class="h-2 w-32 theme-primary-bg mb-4"></div>
            <p class="text-gray-400 font-bold uppercase text-sm">Create news announcements for the homepage</p>
        </div>

        <div class="bg-slate-900 border-4 border-gray-700 p-8 mb-8">
            <form id="announcementForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-black theme-primary-text uppercase mb-2">Title *</label>
                    <input type="text" name="title" required 
                           class="w-full px-4 py-3 bg-slate-800 border-4 border-gray-700 text-white placeholder-gray-500 font-bold uppercase text-sm focus:outline-none focus:border-emerald-500 transition"
                           placeholder="NEW TOURNAMENT SEASON STARTING SOON">
                </div>

                <div>
                    <label class="block text-xs font-black theme-primary-text uppercase mb-2">Content *</label>
                    <textarea name="content" required rows="8"
                              class="w-full px-4 py-3 bg-slate-800 border-4 border-gray-700 text-white placeholder-gray-500 font-semibold text-sm focus:outline-none focus:border-emerald-500 transition"
                              placeholder="Write your announcement here..."></textarea>
                </div>

                <div id="formMessage" class="hidden p-4 border-4 font-bold uppercase text-sm"></div>

                <div class="flex justify-end pt-4">
                    <button type="submit" 
                            class="px-6 py-3 theme-primary-bg text-slate-900 font-black uppercase text-sm brutal-shadow transition-all">
                        Publish Announcement →
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-slate-900 border-4 border-gray-700 p-8">
            <h2 class="text-2xl font-black theme-primary-text uppercase mb-6">All Announcements</h2>
            <div id="announcementsList" class="space-y-4">
                <p class="text-gray-400 text-center py-8 font-bold uppercase">Loading...</p>
            </div>
        </div>
    </div>

    <script src="/js/admin-shell.js"></script>
  <script>
    // Page guard (shared shell): needs content.all_news_gallery
    KBFShell.start({ anyOf: ['content.all_news_gallery'], active: 'news' }).then(function (user) {
        window.kbfUser = user;
        loadAnnouncements();
    });

    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function getCSRFToken() {
        return sessionStorage.getItem('csrf_token');
    }

    async function authenticatedFetch(url, options = {}) {
        const token = getCSRFToken();
        
        if (!options.headers) {
            options.headers = {};
        }
        
        if (token) {
            options.headers['X-CSRF-Token'] = token;
        }
        
        options.credentials = 'include';
        
        return fetch(url, options);
    }

    // ============================================
    // DATA LOADING FUNCTIONS
    // ============================================
    // Announcements as last loaded, so a hide/show change can re-render without a reload
    let loadedAnnouncements = [];

    async function loadAnnouncements() {
        try {
            const response = await authenticatedFetch('/api/announcements.php?limit=50');
            const data = await response.json();

            loadedAnnouncements = (data.success && Array.isArray(data.announcements)) ? data.announcements : [];
            renderAnnouncements(loadedAnnouncements);
        } catch (error) {
            console.error('Error loading announcements:', error);
        }
    }

    function renderAnnouncements(announcements) {
        try {
            const data = { success: true, announcements: announcements };

            const container = document.getElementById('announcementsList');

            // SECURITY: HTML escape function
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            if (data.success && data.announcements.length > 0) {
                container.innerHTML = data.announcements.map(ann => `
                    <div class="border-4 border-gray-700 bg-slate-800 p-5 ${ann.IsVisible == 0 ? 'opacity-60' : ''}">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex-1">
                                <h3 class="font-black text-white uppercase text-lg mb-2">${escapeHtml(ann.Title)}</h3>
                                ${ann.TournamentName ? `<span class="inline-block px-3 py-1 bg-indigo-500 text-slate-900 border-2 border-gray-700 text-xs font-black uppercase mb-2">${escapeHtml(ann.TournamentName)}</span>` : ''}
                            </div>
                            <span class="px-3 py-1 border-2 text-xs font-black uppercase ${ann.IsVisible == 1 ? 'bg-green-500 text-slate-900 border-gray-700' : 'bg-red-500 text-white border-gray-700'}">
                                ${ann.IsVisible == 1 ? 'Visible' : 'Hidden'}
                            </span>
                        </div>
                        ${ann.FeaturedImage ? `<img src="${escapeHtml(ann.FeaturedImage)}" alt="${escapeHtml(ann.Title)}" class="w-full h-32 object-contain bg-slate-700 border-4 border-gray-700 mb-4">` : ''}
                        <p class="text-sm text-gray-300 mb-3 font-semibold">${escapeHtml(ann.Content.substring(0, 150))}${ann.Content.length > 150 ? '...' : ''}</p>
                        <div class="flex justify-between items-center text-xs mb-4 pb-4 border-b-4 border-gray-700">
                            <span class="text-gray-400 font-bold uppercase">Posted by ${escapeHtml(ann.AuthorName)}</span>
                            <span class="text-gray-400 font-bold uppercase">${new Date(ann.PublishedDate).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="toggleVisibility(${ann.AnnouncementId}, ${ann.IsVisible == 1 ? 0 : 1})"
                                    class="flex-1 px-3 py-2 ${ann.IsVisible == 1 ? 'bg-yellow-500' : 'bg-green-500'} text-slate-900 border-4 border-gray-700 font-black uppercase text-xs hover:opacity-90 transition">
                                ${ann.IsVisible == 1 ? 'Hide' : 'Show'}
                            </button>
                            <button onclick="deleteAnnouncement(${ann.AnnouncementId})" 
                                    class="px-3 py-2 bg-red-500 text-white border-4 border-gray-700 font-black uppercase text-xs hover:bg-red-600 transition">
                                Delete
                            </button>
                            <a href="/post?id=${ann.AnnouncementId}" target="_blank"
                               class="px-3 py-2 bg-indigo-500 text-slate-900 border-4 border-gray-700 font-black uppercase text-xs hover:bg-indigo-400 transition">
                                View
                            </a>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-gray-400 text-center py-8 font-bold uppercase">No announcements yet</p>';
            }
        } catch (error) {
            console.error('Error rendering announcements:', error);
        }
    }

    // ============================================
    // CRUD OPERATIONS
    // ============================================
    // newVisibility: 1 = show, 0 = hide
    async function toggleVisibility(announcementId, newVisibility) {
        if (!confirm('Toggle visibility for this announcement?')) return;

        try {
            const response = await authenticatedFetch('/api/announcements.php', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ postId: announcementId, isVisible: newVisibility })
            });

            const result = await response.json();

            if (result.success) {
                // Update this post's state in place and re-render the label, badge and styling.
                // (Re-loading would drop a hidden post, since the list only returns visible posts.)
                loadedAnnouncements.forEach(ann => {
                    if (ann.AnnouncementId == announcementId) {
                        ann.IsVisible = newVisibility;
                    }
                });
                renderAnnouncements(loadedAnnouncements);
            } else {
                alert(result.message || 'Error toggling visibility');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error toggling visibility');
        }
    }

    async function deleteAnnouncement(announcementId) {
        if (!confirm('Are you sure you want to delete this announcement? This will hide it from public view.')) return;

        try {
            const response = await authenticatedFetch(`/api/announcements.php?id=${announcementId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                alert('Announcement deleted successfully');
                loadAnnouncements();
            } else {
                alert(result.message || 'Error deleting announcement');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error deleting announcement');
        }
    }

    document.getElementById('announcementForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(e.target);
        const data = {
            title: formData.get('title'),
            content: formData.get('content')
        };

        try {
            const response = await authenticatedFetch('/api/announcements.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const messageDiv = document.getElementById('formMessage');

            if (result.success) {
                messageDiv.className = 'p-4 border-4 border-green-500 bg-green-500/20 text-green-400 font-bold uppercase text-sm';
                messageDiv.textContent = 'Announcement Published Successfully!';
                messageDiv.classList.remove('hidden');

                e.target.reset();
                loadAnnouncements();

                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 3000);
            } else {
                messageDiv.className = 'p-4 border-4 border-red-500 bg-red-500/20 text-red-400 font-bold uppercase text-sm';
                messageDiv.textContent = result.message || 'Error publishing announcement';
                messageDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });
</script>
<script src="/js/session-manager.js"></script>
</body>
</html>
