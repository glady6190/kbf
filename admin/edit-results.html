<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Results - KBF-UK Admin</title>
    <style>
        :root { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="emerald"] { --theme-primary: #10b981; --theme-secondary: #059669; --theme-light: #34d399; }
        [data-theme="cyan"]    { --theme-primary: #06b6d4; --theme-secondary: #0891b2; --theme-light: #22d3ee; }
        [data-theme="yellow"]  { --theme-primary: #f4f916; --theme-secondary: #eab308; --theme-light: #fef08a; }
        [data-theme="violet"]  { --theme-primary: #A78BFA; --theme-secondary: #8B5CF6; --theme-light: #C4B5FD; }
        .theme-primary-bg     { background-color: var(--theme-primary); }
        .theme-primary-text   { color: var(--theme-primary); }
        .theme-primary-border { border-color: var(--theme-primary); }
    </style>
    <link rel="stylesheet" href="/assets/css/site.css?v=2611200958">
</head>
<body class="bg-slate-950 text-gray-100" data-theme="emerald">

    <div id="kbf-admin-header"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">
        <div id="resultsForm"></div>
    </main>

    <script src="/js/escape.js?v=2611200958"></script>
    <script src="/js/kbf-toast.js?v=2611200958"></script>
    <script src="/js/kbf-dialog.js?v=2611200958"></script>
    <script src="/js/kbf-forms.js?v=2611200958"></script>
    <script src="/js/admin-shell.js?v=2611200958"></script>
    <script src="/js/results-form.js?v=2611200958"></script>
    <script>
    // ============================================
    // Page guard and shared header; the form is js/results-form.js in edit
    // mode (?id= tournament, optional ?category= to open first)
    // ============================================
    KBFShell.start({ anyOf: ['tournaments.manage_all'], active: 'tournaments' }).then(function () {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get('id');
        KBFResultsForm.mount(document.getElementById('resultsForm'), {
            tournamentId: rawId && /^\d+$/.test(rawId) ? parseInt(rawId, 10) : 0,
            backHref: '/admin/tournaments?tab=completed',
            backLabel: 'Tournaments',
            edit: true,
            category: (params.get('category') || '').slice(0, 50)
        });
    });
    </script>
    <script src="/js/session-manager.js?v=2611200958"></script>
</body>
</html>
