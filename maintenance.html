<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Back Soon - KBF-UK</title>
    <style>
        :root { --theme-primary: #10b981; }
        [data-theme="emerald"] { --theme-primary: #10b981; }
        [data-theme="cyan"] { --theme-primary: #06b6d4; }
        [data-theme="yellow"] { --theme-primary: #f4f916; }
        [data-theme="violet"] { --theme-primary: #A78BFA; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            background: #020617;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 32rem;
            background: #0f172a;
            border: 4px solid #374151;
            box-shadow: 8px 8px 0 var(--theme-primary);
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .logo { width: 72px; height: 72px; object-fit: contain; margin: 0 auto 1.25rem; display: block; }
        .icon { width: 48px; height: 48px; margin: 0 auto 1rem; display: block; color: var(--theme-primary); }
        h1 {
            margin: 0 0 .75rem;
            font-size: 1.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .02em;
            color: #fff;
        }
        h1 span { color: var(--theme-primary); }
        .bar { height: 8px; width: 96px; background: var(--theme-primary); margin: 0 auto 1.25rem; }
        p { margin: 0; font-weight: 600; line-height: 1.6; color: #d1d5db; }
        .small { margin-top: 1.5rem; font-size: .8rem; color: #9ca3af; }
        .small a { color: var(--theme-primary); font-weight: 800; }
        @media (min-width: 640px) {
            .card { padding: 2.5rem 2.5rem; }
            h1 { font-size: 2.25rem; }
        }
    </style>
</head>
<body data-theme="emerald">
    <main class="card" role="main">
        <img class="logo" src="/assets/images/logo/KBF-Logo.jpeg" alt="KBF-UK" onerror="this.style.display='none'">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <h1><span>Back</span> soon</h1>
        <div class="bar" aria-hidden="true"></div>
        <p id="maintenanceMessage">We are making some improvements. Please check back shortly.</p>
        <p class="small">Staff can still <a href="/login">sign in</a>.</p>
    </main>
    <script src="/js/escape.js?v=2611211324"></script>
    <script>
    (function () {
        // Remembered colour theme, as on the rest of the site
        // (KBF.storage never throws; the page still works without the helper)
        var theme = window.KBF && KBF.storage ? KBF.storage.get('badminton-theme', null) : null;
        if (['emerald', 'cyan', 'yellow', 'violet'].indexOf(theme) !== -1) {
            document.body.setAttribute('data-theme', theme);
        }

        // The message set in Site settings (the text above is the fallback)
        fetch('/api/public-settings.php', { credentials: 'include' })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data && data.success && typeof data.maintenanceMessage === 'string' && data.maintenanceMessage.trim()) {
                    document.getElementById('maintenanceMessage').textContent = data.maintenanceMessage;
                }
            })
            .catch(function () { /* keep the fallback text */ });
    })();
    </script>
</body>
</html>
